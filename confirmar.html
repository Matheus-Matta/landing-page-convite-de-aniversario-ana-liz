<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#c9a4df">
  <meta name="description" content="Confirmação de presença no aniversário da Ana Liz.">
  <title>Confirme sua presença — Ana Liz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Dancing+Script:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="form-page">
  <main class="rsvp-card">
    <div class="garden garden--top" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="stitched-frame" aria-hidden="true"></div>
    <span class="css-butterfly bf-1" aria-hidden="true"><i></i></span>
    <span class="css-butterfly bf-3" aria-hidden="true"><i></i></span>

    <section class="rsvp-card__content">
      <p class="eyebrow">Ana Liz • 1 ano</p>
      <h1>Confirme sua<br>presença</h1>
      <p class="intro">Vai ser uma alegria ter você com a gente nesse dia tão especial!</p>
      <div class="floral-divider" aria-hidden="true">
        <svg viewBox="0 0 180 30"><path d="M8 17c26 0 31-13 51-8 14 4 16 12 31 12s17-8 31-12c20-5 25 8 51 8"/><path d="M58 9c-8-10-16-3-9 5M122 9c8-10 16-3 9 5"/><path d="M90 21c-10-7-9-16 0-12 9-4 10 5 0 12z"/></svg>
      </div>

      <form id="rsvp-form" class="rsvp-form">
        <label for="name">Nome completo</label>
        <input id="name" name="nome" type="text" autocomplete="name" placeholder="Digite seu nome" required minlength="3">

        <label for="phone">WhatsApp</label>
        <input id="phone" name="whatsapp" type="tel" autocomplete="tel" inputmode="tel" placeholder="(00) 00000-0000" required>

        <fieldset>
          <legend>Você poderá comparecer?</legend>
          <label class="choice"><input type="radio" name="presenca" value="sim" required><span>Sim, estarei presente!</span></label>
          <label class="choice"><input type="radio" name="presenca" value="nao"><span>Não poderei comparecer</span></label>
        </fieldset>

        <label for="guests">Quantidade de pessoas <small>(incluindo você)</small></label>
        <input id="guests" name="quantidade_pessoas" type="number" min="1" max="20" value="1" required>

        <label for="message">Recadinho para a Ana Liz <small>(opcional)</small></label>
        <textarea id="message" name="mensagem" rows="3" maxlength="500" placeholder="Escreva uma mensagem carinhosa..."></textarea>

        <button type="submit"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></svg><span>Confirmar presença</span></button>
        <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
        <a class="back-link" href="index.html" aria-label="Voltar ao convite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>Voltar ao convite</a>
      </form>
    </section>
    <div class="garden garden--bottom" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </main>
  <dialog id="success-modal" class="success-modal" aria-labelledby="success-title">
    <div class="success-modal__flowers" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <span class="css-butterfly success-modal__butterfly" aria-hidden="true"><i></i></span>
    <div class="success-modal__content">
      <span class="success-modal__check" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="m13 25 7 7 15-17"/></svg></span>
      <p class="eyebrow">Resposta enviada</p>
      <h2 id="success-title">Presença<br>confirmada!</h2>
      <p>Obrigada por responder. Estamos muito felizes em celebrar esse momento especial com você!</p>
      <button id="close-success-modal" type="button">Voltar ao convite</button>
    </div>
  </dialog>
  <script src="assets/config.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
